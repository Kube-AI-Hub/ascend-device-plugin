apiVersion: v1
kind: ConfigMap
metadata:
  name: hami-scheduler-device
  namespace: kube-system
  labels:
    app.kubernetes.io/component: hami-scheduler
    app.kubernetes.io/name: hami
    app.kubernetes.io/instance: hami
data:
  device-config.yaml: |-
    vnpus:
      hamiVnpuCore: false
      configs:
      # Ascend 910A series (32G). DCMI chip name is "910B" (no suffix) or "910ProB".
      # Official upstream uses chipName: 910A, which will not match this DCMI report.
      - chipName: "910B"
        devType: Ascend910
        commonWord: Ascend910A
        resourceName: huawei.com/Ascend910A
        resourceMemoryName: huawei.com/Ascend910A-memory
        resourceCoreName: huawei.com/Ascend910A-core
        memoryAllocatable: 32768
        memoryCapacity: 32768
        aiCore: 30
        templates:
          - name: vir02
            memory: 2184
            aiCore: 2
          - name: vir04
            memory: 4369
            aiCore: 4
          - name: vir08
            memory: 8738
            aiCore: 8
          - name: vir16
            memory: 17476
            aiCore: 16
      - chipName: 910B2
        devType: Ascend910B
        commonWord: Ascend910B2
        resourceName: huawei.com/Ascend910B2
        resourceMemoryName: huawei.com/Ascend910B2-memory
        resourceCoreName: huawei.com/Ascend910B2-core
        memoryAllocatable: 65536
        memoryCapacity: 65536
        aiCore: 24
        aiCPU: 6
        templates:
          - name: vir03_1c_8g
            memory: 8192
            aiCore: 3
            aiCPU: 1
          - name: vir06_1c_16g
            memory: 16384
            aiCore: 6
            aiCPU: 1
          - name: vir12_3c_32g
            memory: 32768
            aiCore: 12
            aiCPU: 3
      - chipName: 910B3
        devType: Ascend910B
        commonWord: Ascend910B3
        resourceName: huawei.com/Ascend910B3
        resourceMemoryName: huawei.com/Ascend910B3-memory
        resourceCoreName: huawei.com/Ascend910B3-core
        memoryAllocatable: 65536
        memoryCapacity: 65536
        aiCore: 20
        aiCPU: 7
        templates:
          - name: vir05_1c_16g
            memory: 16384
            aiCore: 5
            aiCPU: 1
          - name: vir10_3c_32g
            memory: 32768
            aiCore: 10
            aiCPU: 3
      # 910B4-1 is a 64G variant. Template names are fixed by the Ascend
      # runtime and must not be changed; memory is the real scheduling size.
      - chipName: 910B4-1
        devType: Ascend910B
        commonWord: Ascend910B4-1
        resourceName: huawei.com/Ascend910B4-1
        resourceMemoryName: huawei.com/Ascend910B4-1-memory
        resourceCoreName: huawei.com/Ascend910B4-1-core
        memoryAllocatable: 65536
        memoryCapacity: 65536
        aiCore: 20
        aiCPU: 7
        templates:
          - name: vir05_1c_8g
            memory: 16384
            aiCore: 5
            aiCPU: 1
          - name: vir10_3c_16g
            memory: 32768
            aiCore: 10
            aiCPU: 3
      - chipName: 910B4
        devType: Ascend910B
        commonWord: Ascend910B4
        resourceName: huawei.com/Ascend910B4
        resourceMemoryName: huawei.com/Ascend910B4-memory
        resourceCoreName: huawei.com/Ascend910B4-core
        memoryAllocatable: 32768
        memoryCapacity: 32768
        aiCore: 20
        aiCPU: 7
        templates:
          - name: vir05_1c_8g
            memory: 8192
            aiCore: 5
            aiCPU: 1
          - name: vir10_3c_16g
            memory: 16384
            aiCore: 10
            aiCPU: 3
      - chipName: 310P3
        devType: Ascend310P
        commonWord: Ascend310P
        resourceName: huawei.com/Ascend310P
        resourceMemoryName: huawei.com/Ascend310P-memory
        resourceCoreName: huawei.com/Ascend310P-core
        memoryAllocatable: 21527
        memoryCapacity: 24576
        memoryMatchMax: 32768
        aiCore: 8
        aiCPU: 7
        templates:
          - name: vir01
            memory: 3072
            aiCore: 1
            aiCPU: 1
          - name: vir02
            memory: 6144
            aiCore: 2
            aiCPU: 2
          - name: vir04
            memory: 12288
            aiCore: 4
            aiCPU: 4
      - chipName: 310P3
        devType: Ascend310P
        commonWord: Ascend310P48
        resourceName: huawei.com/Ascend310P48
        resourceMemoryName: huawei.com/Ascend310P48-memory
        resourceCoreName: huawei.com/Ascend310P48-core
        memoryAllocatable: 43054
        memoryCapacity: 44278
        memoryMatchMin: 32768
        aiCore: 8
        aiCPU: 7
        templates:
          - name: vir01
            memory: 6144
            aiCore: 1
            aiCPU: 1
          - name: vir02
            memory: 12288
            aiCore: 2
            aiCPU: 2
          - name: vir04
            memory: 24576
            aiCore: 4
            aiCPU: 4
      - chipName: Ascend910
        commonWord: Ascend910C
        resourceName: huawei.com/Ascend910C
        resourceMemoryName: huawei.com/Ascend910C-memory
        resourceCoreName: huawei.com/Ascend910C-core
        memoryAllocatable: 65536
        memoryCapacity: 65536
        aiCore: 20
        aiCPU: 7
        templates:
          - name: vir05_1c_16g
            memory: 16384
            aiCore: 5
            aiCPU: 1
          - name: vir10_3c_32g
            memory: 32768
            aiCore: 10
            aiCPU: 3
